[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ganymede4"
version = "0.1.0"
description = "A local intelligence system is not a model. It is a governed runtime in which a model is one probabilistic component."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }

# Intentionally empty. The substrate is stdlib-only by ADR-003: no ORM, no
# service dependency, no daemon. Everything below the optional extra is
# importable on a bare Python 3.11 with the network disconnected.
dependencies = []

[project.optional-dependencies]
# Model access is OPTIONAL and must never be required to produce a valid
# artifact. A missing provider degrades the deterministic tier, which stands
# alone (ADR-001 / target-architecture §5).
inference = ["httpx>=0.27"]

[project.scripts]
ganymede4 = "ganymede4.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
